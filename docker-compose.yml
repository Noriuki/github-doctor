version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: github-doctor-api
    environment:
      - GITHUB_DOCTOR_GITHUB_TOKEN=${GITHUB_DOCTOR_GITHUB_TOKEN}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: "http://localhost:8000"
    container_name: github-doctor-web
    ports:
      - "5173:3000"
    depends_on:
      - api
